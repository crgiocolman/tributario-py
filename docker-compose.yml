services:
  db:
    image: postgres:16
    container_name: tributario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: tributario_py
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tributario_py"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
